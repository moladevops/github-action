
name: Demo pipeline

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches: [main, dev]

  #schedule:
    #- cron: '*/5 * * * *'

jobs:

  setup_job:
    runs-on: ubuntu-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: create a new file
        run: touch github-action.txt

      - name: print hello world
        run: echo hello world

      - name: display readme file
        run: cat README.md

  build_job:
    needs: setup_job
    runs-on: windows-latest

    steps:
      - name: display hello
        run: echo hello

  deploy_job:
    runs-on: macos-latest

    steps:
      - name: display hello world
        run: echo hello mac
